# marker_mapping.yaml
# Mapa completo de marcadores del DOCX maestro → agente responsable + tipo de contenido.
#
# Jerarquía de marcadores:
#   1. {TABLA_*}    — marcador granular para una tabla específica (PRIORIDAD ALTA)
#   2. {ANALISIS_*} — marcador granular para el texto de análisis de un indicador (PRIORIDAD ALTA)
#   3. {SECCION_*}  — marcador de sección completa, usado como FALLBACK si no hay granulares
#
# El orquestador intenta primero los marcadores granulares. Solo usa {SECCION_*}
# si ningún marcador granular de esa sección existe en la plantilla maestra.
#
# Campos por entrada:
#   marker:      Marcador exacto tal como aparece en la plantilla DOCX.
#   type:        "tabla" | "analisis" | "seccion" | "metadata"
#   agent:       ID del agente responsable de generar el contenido.
#   section:     ID de la sección a la que pertenece (para agrupar y ordenar).
#   table_key:   Clave de clasificación de tabla (solo para tipo "tabla").
#   description: Descripción legible del contenido esperado.
#   fallback:    Mensaje a insertar si no hay datos disponibles.
#   priority:    Orden de reemplazo dentro de la sección (1 = primero).

metadata:
  version: "1.1"
  last_updated: "2026-05-19"
  strategy: >
    Prioridad: marcadores granulares ({TABLA_*}, {ANALISIS_*}) sobre marcadores de sección
    ({SECCION_*}). El orquestador detecta qué marcadores existen en la plantilla maestra
    y aplica solo los que están presentes. Nunca falla si un marcador no existe en la plantilla.
  ingestion_mode: "single_docx"
  ingestion_note: >
    El sistema recibe un único DOCX mensual que contiene todas las tablas en orden,
    junto con títulos, precisiones, especificaciones y notas operativas. El campo
    optional_context: true indica que el marcador de análisis puede recibir
    context_notes del DOCX mensual para enriquecer el análisis.

# ─────────────────────────────────────────────────────────────────
# MARCADORES DE METADATOS (siempre presentes)
# ─────────────────────────────────────────────────────────────────
metadata_markers:
  - marker: "{MES}"
    type: metadata
    description: "Nombre del mes en mayúsculas (ENERO, FEBRERO, ...)"

  - marker: "{AÑO}"
    type: metadata
    description: "Año de cuatro dígitos (2026, ...)"

